name: "CodeQL Config"

# Конфигурация для анализа C++ и Python кода в IoT проекте
queries:
  # Стандартные запросы безопасности (гарантированно работают)
  - uses: security-and-quality
  # Дополнительные запросы для embedded/IoT
  - uses: security-extended

# Исключаем тестовые файлы и заглушки
paths-ignore:
  - "test/**"
  - "test_stubs/**"
  - "docs/**"
  - "site/**"
  - ".github/**"
  - "scripts/**"
  - "*.md"

# Настройки для C++ анализа
paths:
  - "src/**"
  - "include/**"
  - "main.cpp"
  - "platformio.ini"

# Дополнительные настройки для embedded разработки
query-filters:
  - include:
      tags contain: security
  - include:
      tags contain: correctness
  - exclude:
      tags contain: experimental 