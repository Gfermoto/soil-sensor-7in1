site_name: JXCT Soil Sensor v3.13.2
site_url: https://gfermoto.github.io/soil-sensor-7in1/
site_description: Профессиональная IoT система мониторинга почвы на базе ESP32
site_author: EYERA Development Team
# site_version: 3.6.7  # Устаревший параметр

repo_name: Gfermoto/soil-sensor-7in1
repo_url: https://github.com/Gfermoto/soil-sensor-7in1
edit_uri: edit/main/docs/

# Современные настройки
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gfermoto/soil-sensor-7in1
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/Gfermoto
      name: Telegram Support

# Кастомные стили
extra_css:
  - stylesheets/extra.css

# Яркий современный дизайн
theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Переключить на темную тему
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/images/favicon.png
  logo: assets/images/favicon.png

# Плагины
plugins:
  - search:
      lang: ru
      separator: '[\s\-,:!=\[\]()"/`|]+'

# Расширения Markdown
markdown_extensions:
  - toc:
      permalink: true
      title: "Содержание"
      permalink_title: "Постоянная ссылка"
      baselevel: 1
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
      emoji_index: !!python/name:pymdownx.emoji.twemoji
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.saneheaders

# Навигация
nav:
  - Главная: index.md
  - Проект:
    - Журнал изменений: CHANGELOG.md
    - Руководство для контрибьюторов: CONTRIBUTING.md
  - Руководства:
    - Руководство пользователя: manuals/USER_GUIDE.md
    - Агрономические рекомендации: manuals/AGRO_RECOMMENDATIONS.md
    - Техническая документация: manuals/TECHNICAL_DOCS.md
    - Схема подключения: manuals/WIRING_DIAGRAM.md
    - API документация: manuals/API.md
    - Протокол Modbus: manuals/MODBUS_PROTOCOL.md
    - Управление конфигурацией: manuals/CONFIG_MANAGEMENT.md
    - Управление версиями: manuals/VERSION_MANAGEMENT.md
    - Руководство по компенсации: manuals/COMPENSATION_GUIDE.md
  - API:
    - API документация: manuals/API.md
    - C++ API (Doxygen): DOXYGEN_API.md
  - Разработка:
    - Руководство по скриптам: SCRIPTS_GUIDE.md
    - Раздел разработки: dev/README.md
    - Архитектура: dev/ARCH_OVERALL.md
    - Clang Tools: dev/CLANG_TOOLS_GUIDE.md
    - Технический долг: dev/TECHNICAL_DEBT_QUICK_REFERENCE.md
    - Отчёт техдолга: dev/TECHNICAL_DEBT_REPORT.md
    - План рефакторинга: dev/REFACTORING_PLAN.md
    - Ревью перед публикацией: dev/PRE_PUBLISH_REVIEW.md
    - Безопасность: dev/SECURITY.md
    - Алгоритмы (TG): ALGORITHMS_OVERVIEW_TG.md
  - Руководства (доп.):
    - Взаимодействие питательных веществ: manuals/NUTRIENT_INTERACTIONS.md
  - Тестирование:
    - Руководство по тестированию: TESTING_GUIDE.md
    - Быстрая справка: TESTING_QUICK_REFERENCE.md
